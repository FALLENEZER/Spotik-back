nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin:
            - 'http://localhost:5173'
            - 'http://127.0.0.1:5173'
            - 'http://localhost:8080'
            - 'http://127.0.0.1:8080'
            - 'http://localhost:3000'
            - 'http://127.0.0.1:3000'
        allow_methods: [ 'GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS' ]
        allow_headers: [ '*' ]
        expose_headers: [ 'Link', 'X-Total-Count', 'Content-Disposition' ]
        allow_credentials: true
        max_age: 3600
    paths:
        '^/':
            allow_origin:
                - 'http://localhost:5173'
                - 'http://127.0.0.1:5173'
                - 'http://localhost:8080'
                - 'http://127.0.0.1:8080'
                - 'http://localhost:3000'
                - 'http://127.0.0.1:3000'
            allow_headers: [ '*' ]
            allow_methods: [ 'GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS' ]
            allow_credentials: true
            max_age: 3600
